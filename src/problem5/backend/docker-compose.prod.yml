services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
          }
        '
        until mongosh --host mongodb:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep true; do
          sleep 1;
        done
    restart: "no"

  prisma-setup:
    build:
      context: .
      target: build
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mongodb://mongodb:27017/movie-backend?replicaSet=rs0&directConnection=true
    command: yarn prisma:push
    restart: "no"

  backend:
    build:
      context: .
      target: prod
    depends_on:
      prisma-setup:
        condition: service_completed_successfully
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongodb:27017/movie-backend?replicaSet=rs0&directConnection=true
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    command: sh -c "node dist/index.js"

volumes:
  mongodb-data:
