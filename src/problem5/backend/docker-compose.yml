services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
          }
        '
        until mongosh --host mongodb:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep true; do
          sleep 1;
        done
    restart: "no"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: dev
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mongodb://mongodb:27017/movie-backend?replicaSet=rs0&directConnection=true
      RABBITMQ_URL: amqp://rabbitmq:5672
      MEDIA_UPLOAD_QUEUE: movie-media-upload
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "yarn prisma:generate && yarn prisma:push && yarn dev"

  media-worker:
    build:
      context: .
      target: dev
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://mongodb:27017/movie-backend?replicaSet=rs0&directConnection=true
      RABBITMQ_URL: amqp://rabbitmq:5672
      MEDIA_UPLOAD_QUEUE: movie-media-upload
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "yarn prisma:generate && yarn prisma:push && yarn dev:worker"

volumes:
  mongodb-data:
